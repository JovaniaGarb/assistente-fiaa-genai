<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 640" width="1500" height="640" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1500" height="640" fill="#fff"/>
<text x="750" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1A202C">Como a base de conhecimento funciona, em 3 etapas</text>
<text x="750" y="66" text-anchor="middle" font-size="14" fill="#4A5568">O assistente só responde com o que está na base e sempre mostra de onde veio</text>
<rect x="40" y="100" width="380" height="300" rx="12" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.8"/>
<circle cx="66" cy="124" r="15" fill="#2F855A"/><text x="66" y="129" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<text x="90" y="128" font-size="16" font-weight="700" fill="#1C4532">Fontes</text>
<text x="56" y="156" text-anchor="start" font-size="15.5" fill="#1C4532">SAP Help (PDF, 221 páginas)</text>
<text x="56" y="175" text-anchor="start" font-size="15.5" fill="#1C4532"></text>
<text x="56" y="194" text-anchor="start" font-size="15.5" fill="#1C4532">Treinamento S4F17 (planilha)</text>
<text x="56" y="213" text-anchor="start" font-size="15.5" fill="#1C4532"></text>
<text x="56" y="232" text-anchor="start" font-size="15.5" fill="#1C4532">Template de migração TS07</text>
<text x="56" y="251" text-anchor="start" font-size="15.5" fill="#1C4532"></text>
<text x="56" y="270" text-anchor="start" font-size="15.5" fill="#1C4532">Só estas três.</text>
<text x="56" y="289" text-anchor="start" font-size="15.5" fill="#1C4532">Nenhum conhecimento externo.</text>
<path d="M420,250 L470,250" stroke="#4A5568" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
<rect x="470" y="100" width="420" height="300" rx="12" fill="#E6F6EC" stroke="#2F855A" stroke-width="1.8"/>
<circle cx="496" cy="124" r="15" fill="#2F855A"/><text x="496" y="129" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<text x="520" y="128" font-size="16" font-weight="700" fill="#1C4532">Base curada (14 documentos)</text>
<text x="486" y="156" text-anchor="start" font-size="15" fill="#1C4532">Cada documento é dividido em seções:</text>
<text x="486" y="175" text-anchor="start" font-size="15" fill="#1C4532">  Quando se aplica · Causas · Verificações</text>
<text x="486" y="194" text-anchor="start" font-size="15" fill="#1C4532">  Exige validação humana · Referências</text>
<text x="486" y="213" text-anchor="start" font-size="15" fill="#1C4532"></text>
<text x="486" y="232" text-anchor="start" font-size="15" fill="#1C4532">8 processos (dados mestre, baixa, depreciação…)</text>
<text x="486" y="251" text-anchor="start" font-size="15" fill="#1C4532">3 regras do assistente (escalar, dados mínimos,</text>
<text x="486" y="270" text-anchor="start" font-size="15" fill="#1C4532">   fora do escopo) · 2 dicionários · 1 glossário</text>
<text x="486" y="289" text-anchor="start" font-size="15" fill="#1C4532"></text>
<text x="486" y="308" text-anchor="start" font-size="15" fill="#1C4532">Cada afirmação traz a página da fonte.</text>
<path d="M890,250 L940,250" stroke="#4A5568" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
<rect x="940" y="100" width="520" height="300" rx="12" fill="#F7FAFC" stroke="#2B6CB0" stroke-width="1.8"/>
<circle cx="966" cy="124" r="15" fill="#2B6CB0"/><text x="966" y="129" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text><text x="990" y="128" font-size="16" font-weight="700" fill="#1A365D">Busca com citação (RAG)</text>
<rect x="956" y="146" width="488" height="70" rx="9" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.3"/>
<rect x="968" y="159" width="44" height="44" rx="8" fill="#2B6CB0"/><text x="990" y="189" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">R</text>
<text x="1026" y="175" font-size="15" font-weight="700" fill="#1A365D">Buscar</text>
<text x="1026" y="197" font-size="12.5" fill="#1A365D">acha os trechos certos (palavras + glossário PT→SAP)</text>
<rect x="956" y="228" width="488" height="70" rx="9" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.3"/>
<rect x="968" y="241" width="44" height="44" rx="8" fill="#2B6CB0"/><text x="990" y="271" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">A</text>
<text x="1026" y="257" font-size="15" font-weight="700" fill="#1A365D">Aumentar</text>
<text x="1026" y="279" font-size="12.5" fill="#1A365D">entrega só esses trechos ao modelo; o chamado vai como dado</text>
<rect x="956" y="310" width="488" height="70" rx="9" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.3"/>
<rect x="968" y="323" width="44" height="44" rx="8" fill="#2B6CB0"/><text x="990" y="353" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">G</text>
<text x="1026" y="339" font-size="15" font-weight="700" fill="#1A365D">Gerar</text>
<text x="1026" y="361" font-size="12.5" fill="#1A365D">redige a recomendação citando a fonte; um validador confere</text>
<path d="M1070,400 L1070,450" stroke="#4A5568" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
<rect x="940" y="450" width="250" height="110" rx="12" fill="#EDF0F3" stroke="#5A6877" stroke-width="1.8"/>
<text x="1065.0" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#25303B">Sem trecho relevante?</text>
<text x="1065.0" y="506" text-anchor="middle" font-size="13.5" fill="#25303B">diz “sem evidência”</text>
<text x="1065.0" y="525" text-anchor="middle" font-size="13.5" fill="#25303B">e escala para um consultor</text>
<text x="1065.0" y="544" text-anchor="middle" font-size="13.5" fill="#25303B">(não inventa)</text>
<path d="M1335,400 L1335,450" stroke="#4A5568" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
<rect x="1210" y="450" width="250" height="110" rx="12" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.8"/>
<text x="1335.0" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#1A365D">Resposta com fonte</text>
<text x="1335.0" y="506" text-anchor="middle" font-size="13.5" fill="#1A365D">recomendação + página</text>
<text x="1335.0" y="525" text-anchor="middle" font-size="13.5" fill="#1A365D">da documentação + ação</text>
<text x="1335.0" y="544" text-anchor="middle" font-size="13.5" fill="#1A365D">que depende de humano</text>
<text x="750" y="600" text-anchor="middle" font-size="13" fill="#718096">Sem modelo de linguagem (modo extrativo) a etapa G monta a resposta apenas com linhas da própria base; com o modelo ligado, ele redige e o validador confere.</text>
</svg>