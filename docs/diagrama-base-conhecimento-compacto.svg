<circle cx="384" cy="48" r="16" fill="#2F855A"/><text x="384" y="54" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text><text x="410" y="54" font-size="21" font-weight="700" fill="#1C4532">Base curada</text>
<text x="384" y="98" font-size="19" fill="#1C4532">14 documentos</text>
<text x="384" y="124" font-size="19" fill="#1C4532">divididos em seções</text>
<text x="384" y="150" font-size="19" fill="#1C4532">(causas, verificações,</text>
<text x="384" y="176" font-size="19" fill="#1C4532">ação humana)</text>
<text x="384" y="214" font-size="16" font-style="italic" fill="#2F855A">cada afirmação cita a página</text>
