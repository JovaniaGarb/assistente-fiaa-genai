<text x="1144" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#1A365D">Gerar</text>
<text x="1144" y="183" text-anchor="middle" font-size="15" fill="#1A365D">resposta +</text><text x="1144" y="202" text-anchor="middle" font-size="15" fill="#1A365D">validação</text>
