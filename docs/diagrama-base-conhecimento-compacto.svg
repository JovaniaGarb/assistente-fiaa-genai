<rect x="730" y="20" width="500" height="210" rx="12" fill="#F7FAFC" stroke="#2B6CB0" stroke-width="2"/>
<circle cx="754" cy="48" r="16" fill="#2B6CB0"/><text x="754" y="54" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text><text x="780" y="54" font-size="21" font-weight="700" fill="#1A365D">Busca com citação (RAG)</text>
<rect x="750" y="82" width="148" height="138" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.4"/>
<rect x="802" y="92" width="44" height="44" rx="9" fill="#2B6CB0"/><text x="824" y="124" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">R</text>
<text x="824" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#1A365D">Buscar</text>
<text x="824" y="183" text-anchor="middle" font-size="15" fill="#1A365D">trechos</text><text x="824" y="202" text-anchor="middle" font-size="15" fill="#1A365D">certos</text>
<rect x="910" y="82" width="148" height="138" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.4"/>
<rect x="962" y="92" width="44" height="44" rx="9" fill="#2B6CB0"/><text x="984" y="124" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">A</text>
<text x="984" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#1A365D">Aumentar</text>
<text x="984" y="183" text-anchor="middle" font-size="15" fill="#1A365D">só esses ao</text><text x="984" y="202" text-anchor="middle" font-size="15" fill="#1A365D">modelo</text>
<rect x="1070" y="82" width="148" height="138" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.4"/>
