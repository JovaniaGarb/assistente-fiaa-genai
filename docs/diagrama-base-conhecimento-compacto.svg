<rect x="1270" y="20" width="210" height="100" rx="12" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/>
<text x="1375" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#1A365D">Resposta</text><text x="1375" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#1A365D">com fonte</text><text x="1375" y="103" text-anchor="middle" font-size="14" fill="#1A365D">+ ação humana</text>
<rect x="1270" y="130" width="210" height="100" rx="12" fill="#EDF0F3" stroke="#5A6877" stroke-width="2"/>
<text x="1375" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#25303B">Sem trecho?</text><text x="1375" y="190" text-anchor="middle" font-size="15" fill="#25303B">“sem evidência”,</text><text x="1375" y="210" text-anchor="middle" font-size="15" fill="#25303B">escala ao consultor</text>
<text x="750" y="308" text-anchor="middle" font-size="14" fill="#718096">Sem modelo de linguagem, a etapa G monta a resposta só com linhas da própria base.</text>
